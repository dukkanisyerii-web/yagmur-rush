name: Build LyricStream v4 APK

on:
  push:
    branches:
      - lyricstream-v4-apk
    paths:
      - "lyricstream/**"
      - ".github/workflows/lyricstream-v4-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36"
          fi

      - name: Reassemble and verify v3 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lyricstream-src"
          cat lyricstream/source/chunk_*.b64 | base64 --decode > "$RUNNER_TEMP/lyricstream_overlay_v3.zip"
          echo "b46cd3b8b66de03811d7823dbe9ea4b8f357feebf50234de89fe9317064d23dd  $RUNNER_TEMP/lyricstream_overlay_v3.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lyricstream_overlay_v3.zip" -d "$RUNNER_TEMP/lyricstream-src"

      - name: Reassemble and verify v4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat lyricstream/v4/patch/chunk_*.b64 | base64 --decode > "$RUNNER_TEMP/lyricstream_v4_patch.zip"
          echo "1baf0c7323d769e2fb9b358e90d94322f89423493efadc00c9ef8c59329f611b  $RUNNER_TEMP/lyricstream_v4_patch.zip" | sha256sum -c -
          unzip -qo "$RUNNER_TEMP/lyricstream_v4_patch.zip" -d "$RUNNER_TEMP/lyricstream-src/lyricstream_overlay_v3"

      - name: Bootstrap Android project
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/lyricstream-src/lyricstream_overlay_v3/bootstrap.sh"
          "$RUNNER_TEMP/lyricstream-src/lyricstream_overlay_v3/bootstrap.sh" "$RUNNER_TEMP/lyricstream_build"

      - name: Apply Flutter 3.47 / AGP 9 build config
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/lyricstream_build/test"
          cat > "$RUNNER_TEMP/lyricstream_build/android/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.example.lyricstream"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.example.lyricstream"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.dynamicanimation:dynamicanimation:1.1.0")
              implementation("com.android.billingclient:billing-ktx:9.1.0")
              testImplementation("junit:junit:4.13.2")
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Patch Billing 9 nullable offer token
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/lyricstream_build/android/app/src/main/kotlin/com/example/lyricstream/BillingManager.kt"
          grep -q 'setOfferToken(offer.offerToken)' "$FILE"
          sed -i 's/setOfferToken(offer\.offerToken)/setOfferToken(offer.offerToken ?: return BillingClient.BillingResponseCode.ITEM_UNAVAILABLE)/' "$FILE"

      - name: Flutter analyze
        continue-on-error: true
        working-directory: ${{ runner.temp }}/lyricstream_build
        run: flutter analyze lib

      - name: Build release APK
        working-directory: ${{ runner.temp }}/lyricstream_build
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/lyricstream_build/build/app/outputs/flutter-apk/app-release.apk" "$GITHUB_WORKSPACE/LyricStream-v4-release.apk"
          sha256sum "$GITHUB_WORKSPACE/LyricStream-v4-release.apk" | tee "$GITHUB_WORKSPACE/LyricStream-v4-release.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: LyricStream-v4-APK
          path: |
            LyricStream-v4-release.apk
            LyricStream-v4-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
