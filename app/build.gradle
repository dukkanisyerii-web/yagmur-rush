plugins { id "com.android.application" }

android {
    namespace "com.forestzen.studio"
    compileSdk 36

    defaultConfig {
        applicationId "com.forestzen.studio"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "1.2"
    }
}

def forestZenAsset = file("src/main/res/drawable-nodpi/widget_clock_bg.webp")

tasks.register("prepareForestZenAssets") {
    doLast {
        forestZenAsset.parentFile.mkdirs()
        def parts = (0..2).collect { i ->
            rootProject.file(String.format(".github/assets/widget_clock_bg.part%02d", i))
        }
        if (parts.any { !it.exists() }) {
            throw new GradleException("Forest Zen generated image asset parts are missing.")
        }
        def encoded = parts.collect { it.getText("UTF-8").trim() }.join("")
        forestZenAsset.bytes = encoded.decodeBase64()
        println "Prepared real Forest Zen widget image: " + forestZenAsset
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareForestZenAssets")
}
